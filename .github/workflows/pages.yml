name: Deploy FASTQ Sonifier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate the approved browser app
        shell: bash
        run: |
          test -s index.html
          test -s app.js
          test -s example-data.js
          test -s styles.css
          node --check app.js
          node --check example-data.js
          grep -q "Try synthetic example" index.html
          grep -q "How to read playback" index.html
          grep -q "scholar.google.com/citations?user=aIPvbqAAAAAJ" index.html
          grep -q 'data-preset="microscope" aria-pressed="true"' index.html
          grep -q 'id="tempoInput" type="range" min="42" max="156" step="1" value="42"' index.html
          grep -q '<option value="pentatonic" selected>Minor pentatonic</option>' index.html
          grep -q "narcherna.github.io" app.js
          ! find . -type f | grep -Ei '\\.(fastq|fq|bam|cram|sam)(\\.gz)?$'
          ! grep -i "orchestr" index.html app.js example-data.js styles.css README.md

      - name: Assemble the public site
        shell: bash
        run: |
          mkdir _site
          cp index.html app.js example-data.js styles.css .nojekyll _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
